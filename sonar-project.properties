# Used only after switching SonarQube Cloud from automatic to CI-based analysis.
# Never put an access token or other secret in this file.
sonar.projectKey=bakadja_vinyl-shop-fullstack-auth
sonar.organization=bakadja

# Keep static analysis across the repository, including session and TLS helpers.
sonar.sources=.
sonar.tests=test
sonar.exclusions=test/**,coverage/**,node_modules/**
sonar.test.inclusions=test/**/*.test.js

# Generated by the native Node.js 24 test runner in the Linux test job.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
