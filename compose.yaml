services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE}
      POSTGRES_USER: ${PGUSER:?Set PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
    ports:
      - '127.0.0.1:${PGPORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15
  postgres-test:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: ${VINYL_TEST_ADMIN_PASSWORD:?Set VINYL_TEST_ADMIN_PASSWORD}
      VINYL_TEST_PASSWORD: ${VINYL_TEST_PASSWORD:?Set VINYL_TEST_PASSWORD}
    ports:
      - '127.0.0.1:15433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./test-support/provision-test-db.sql:/docker-entrypoint-initdb.d/test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vinyl_shop_test']
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres-data:
