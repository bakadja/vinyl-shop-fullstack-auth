name: Azure delivery (blocked pending evidence)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'bakadja/vinyl-shop-fullstack-auth' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install locked guard dependencies without lifecycle scripts
        run: npm ci --omit=dev --ignore-scripts
      # Committed closed gate: fails before any Azure authentication or mutation.
      - run: node scripts/azure/check-readiness.js
      - run: node scripts/azure/check-github.js
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Assemble runtime allowlist outside checkout
        run: node scripts/azure/package.js "$RUNNER_TEMP/runtime"
      - name: Install locked runtime dependencies without lifecycle scripts
        run: npm ci --omit=dev --ignore-scripts --prefix "$RUNNER_TEMP/runtime"
      - name: Package exact commit without rebuilding on Azure
        working-directory: ${{ runner.temp }}/runtime
        run: |
          zip -qr "$RUNNER_TEMP/runtime.zip" .
          cd "$RUNNER_TEMP"
          sha256sum runtime.zip > runtime.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime.zip
            ${{ runner.temp }}/runtime.zip.sha256
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: [preflight, build]
    environment: azure-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install locked guard dependencies without lifecycle scripts
        run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/azure/check-readiness.js
      # Recheck after approval: changed policy, main or CI must fail before OIDC.
      - run: node scripts/azure/check-github.js
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: azure-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Verify artifact bytes
        working-directory: ${{ runner.temp }}/release
        run: sha256sum --check runtime.zip.sha256
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/release/runtime.zip
      - name: Check public readiness over verified HTTPS
        env:
          HEALTH_URL: ${{ vars.AZURE_HEALTH_URL }}
        run: node scripts/azure/smoke.js
