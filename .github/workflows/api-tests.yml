name: API tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # Disposable service credential supplied by the CI run, never an app secret.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Provision restricted disposable test database
        env:
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export VINYL_TEST_PASSWORD=$(node -e 'process.stdout.write(require("crypto").randomBytes(24).toString("hex"))')
          echo "::add-mask::$VINYL_TEST_PASSWORD"
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d postgres -f test-support/provision-test-db.sql
          echo "TEST_DATABASE_URL=postgresql://vinyl_shop_test:${VINYL_TEST_PASSWORD}@127.0.0.1:5432/vinyl_shop_test" >> "$GITHUB_ENV"
      - name: Enable verified TLS on disposable PostgreSQL service
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/check-ci-certificate-guards.js
          node scripts/configure-ci-test-tls.js
      - name: Run database and HTTP integration tests with LCOV
        env:
          PG_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p coverage
          npm run test:coverage
      - name: Verify non-empty LCOV report
        run: |
          test -s coverage/lcov.info
          grep -q '^SF:' coverage/lcov.info
      - name: Upload Linux LCOV report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  test-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx --no-install playwright install chromium
      - name: Install PostgreSQL 17
        run: brew install postgresql@17
      - name: Run database and HTTP integration tests
        # The helper owns a fresh private cluster and always stops it via EXIT trap.
        run: bash scripts/start-test-postgres.sh npm test

  # Keep existing SonarCloud automatic analysis until the repository owner explicitly
  # switches SonarCloud to CI-based analysis and enables SONAR_CI_ENABLED.
  # Never expose SONAR_TOKEN to PR test code or to fork-origin pull requests.
  sonar-coverage:
    if: >-
      ${{ vars.SONAR_CI_ENABLED == 'true' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download coverage from unprivileged Linux tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-lcov
          path: coverage
      - name: Check coverage artifact
        run: |
          test -s coverage/lcov.info
          grep -q '^SF:' coverage/lcov.info
      - name: Scan with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

