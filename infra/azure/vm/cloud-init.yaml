#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - python3
  - ufw
bootcmd:
  - [bash, -lc, "install -d -o root -g root -m 0755 /opt/vinyl-shop"]
write_files:
  - path: /usr/local/sbin/fetch-vinyl-secrets
    owner: root:root
    permissions: '0700'
    content: |
      #!/usr/bin/python3
      import json
      import os
      import pathlib
      import shlex
      import sys
      import urllib.parse
      import urllib.request

      VAULT = 'https://__VAULT_NAME__.vault.azure.net'
      SECRET_NAMES = {
          'PGPASSWORD': 'runtime-db-password',
          'SPIRAL_SESSION_SECRET': 'session-signing-key',
          'SPIRAL_SESSION_PREVIOUS_SECRETS': 'session-verification-keys',
          'AUTH_ABUSE_HMAC_KEY': 'auth-abuse-hmac-key',
          'SENTRY_DSN': 'sentry-dsn',
      }

      def get_json(url, headers):
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request, timeout=8) as response:
              return json.loads(response.read())

      try:
          token_data = get_json(
              'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net',
              {'Metadata': 'true'},
          )
          token = token_data['access_token']
          values = {}
          for variable, name in SECRET_NAMES.items():
              encoded_name = urllib.parse.quote(name, safe='')
              data = get_json(f'{VAULT}/secrets/{encoded_name}?api-version=7.4', {'Authorization': f'Bearer {token}'})
              values[variable] = data['value']
          destination = pathlib.Path('/etc/vinyl-shop/runtime.secrets')
          temporary = destination.with_suffix('.tmp')
          content = ''.join(f'export {key}={shlex.quote(value)}\n' for key, value in values.items())
          with open(temporary, 'w', encoding='utf-8') as output:
              output.write(content)
              output.flush()
              os.fsync(output.fileno())
          import grp
          os.chown(temporary, 0, grp.getgrnam('vinyl').gr_gid)
          os.chmod(temporary, 0o640)
          os.replace(temporary, destination)
      except Exception:
          print('Key Vault secret refresh failed; application remains stopped.', file=sys.stderr)
          sys.exit(1)
  - path: /usr/local/sbin/start-vinyl-shop
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      set -eu
      set -a
      . /etc/vinyl-shop/runtime.secrets
      set +a
      exec /usr/bin/node --import ./instrument.js server.js
  - path: /opt/vinyl-shop/Caddyfile
    owner: root:root
    permissions: '0644'
    content: |
      {
        admin off
      }

      __APP_DOMAIN__ {
        encode zstd gzip
        reverse_proxy 127.0.0.1:8000 {
          header_up X-Forwarded-For {remote_host}
        }
      }
  - path: /etc/systemd/system/vinyl-secrets.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Fetch Vinyl Shop runtime secrets from Azure Key Vault
      Wants=network-online.target
      After=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/fetch-vinyl-secrets
      Restart=on-failure
      RestartSec=30s
  - path: /etc/systemd/system/vinyl-shop.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Vinyl Shop Express application
      Requires=vinyl-secrets.service
      After=network-online.target vinyl-secrets.service
      [Service]
      Type=simple
      User=vinyl
      Group=vinyl
      WorkingDirectory=/opt/vinyl-shop/current
      Environment=NODE_ENV=production
      Environment=PORT=8000
      Environment=APP_BIND_ADDRESS=127.0.0.1
      Environment=PUBLIC_ORIGIN=https://__APP_DOMAIN__
      Environment=SESSION_PROXY_MODE=verified-proxy
      Environment=TRUSTED_PROXY_CIDRS=127.0.0.1/32
      Environment=PGPORT=5432
      Environment=PGDATABASE=vinyl_shop
      Environment=PGUSER=vinyl_runtime
      Environment=PGSSLMODE=verify-full
      Environment=PGSSLROOTCERT=/opt/vinyl-shop/current/certificates/azure-postgresql-roots.pem
      Environment=PGHOST=__POSTGRES_HOST__
      ExecStart=/usr/local/sbin/start-vinyl-shop
      Restart=on-failure
      RestartSec=5s
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectHome=true
      ProtectSystem=strict
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [bash, -lc, "groupadd --system vinyl && useradd --system --gid vinyl --home-dir /nonexistent --shell /usr/sbin/nologin vinyl"]
  - [bash, -lc, "install -d -o root -g root -m 0755 /etc/vinyl-shop /opt/vinyl-shop /var/lib/vinyl-shop /usr/share/keyrings"]
  - [bash, -lc, "curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor --yes -o /usr/share/keyrings/nodesource.gpg && printf '%s\\n' 'Types: deb' 'URIs: https://deb.nodesource.com/node_24.x' 'Suites: nodistro' 'Components: main' 'Signed-By: /usr/share/keyrings/nodesource.gpg' > /etc/apt/sources.list.d/nodesource.sources"]
  - [bash, -lc, "curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor --yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg && curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt > /etc/apt/sources.list.d/caddy-stable.list && chmod 0644 /usr/share/keyrings/nodesource.gpg /usr/share/keyrings/caddy-stable-archive-keyring.gpg /etc/apt/sources.list.d/caddy-stable.list"]
  - [bash, -lc, "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs caddy"]
  - [bash, -lc, "install -o root -g caddy -m 0640 /opt/vinyl-shop/Caddyfile /etc/caddy/Caddyfile && systemctl daemon-reload && systemctl enable --now caddy"]
